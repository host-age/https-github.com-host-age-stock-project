<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSE AI Trading Agent</title><style>body{font-family:Inter,Arial,sans-serif;background:#0b1220;color:#e9eef7;margin:0;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#121c2d;border:1px solid #24314a;border-radius:14px;padding:16px}.wide{grid-column:span 2}.value{font-size:28px;font-weight:700}.mono{font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}button,input,select{padding:10px 12px;border-radius:8px;border:1px solid #34445e;background:#0f1726;color:#e9eef7}button{cursor:pointer;background:#2f6fed;border:0}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}.badge{font-family:ui-monospace,monospace;font-size:11px;padding:3px 8px;border-radius:999px;letter-spacing:.04em}.badge.live{background:#173829;color:#5cd68a}.badge.synthetic_fallback{background:#3a2a12;color:#e0a94c}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}}</style></head><body><h1>NSE AI Trading Agent</h1><p>Paper-trading model driven by live NSE quotes (Yahoo Finance feed). <b>Live broker execution is disabled.</b></p><div class="row"><select id="symbol"><option value="RELIANCE">RELIANCE</option><option value="TCS">TCS</option><option value="INFY">INFY</option><option value="HDFCBANK">HDFCBANK</option><option value="ICICIBANK">ICICIBANK</option><option value="SBIN">SBIN</option><option value="NIFTY">NIFTY 50</option><option value="BANKNIFTY">BANK NIFTY</option></select><input id="custom" placeholder="or type a ticker, e.g. TATASTEEL" style="width:200px"><button onclick="simulate()">Run decision</button><button onclick="backtest()">Run backtest</button><button onclick="resetAgent()">Reset</button><span id="feedBadge" class="badge">—</span></div><div class="grid"><div class="card"><div>Mode</div><div class="value">PAPER</div></div><div class="card"><div>Cash</div><div id="cash" class="value">—</div></div><div class="card"><div>Equity</div><div id="equity" class="value">—</div></div><div class="card"><div>Daily P&amp;L</div><div id="pnl" class="value">—</div></div><div class="card wide"><h3>Last Decision</h3><pre id="decision" class="mono">—</pre></div><div class="card wide"><h3>Positions</h3><pre id="positions" class="mono">—</pre></div><div class="card wide"><h3>Execution / Backtest</h3><pre id="output" class="mono">—</pre></div><div class="card wide"><h3>Recent Trade Log</h3><pre id="log" class="mono">—</pre></div></div><script>function activeSymbol(){return (custom.value.trim()||symbol.value).toUpperCase()}async function j(u,o){return (await fetch(u,o)).json()}function setBadge(source){feedBadge.textContent=source==='live'?'LIVE FEED':(source?'SYNTHETIC FALLBACK':'—');feedBadge.className='badge '+(source||'')}async function refresh(){const d=await j('/api/status');cash.textContent='₹'+d.cash.toFixed(2);equity.textContent='₹'+d.equity.toFixed(2);pnl.textContent='₹'+d.daily_pnl.toFixed(2);decision.textContent=JSON.stringify(d.last_decision,null,2);positions.textContent=JSON.stringify(d.positions,null,2);log.textContent=JSON.stringify(d.trade_log,null,2)}async function simulate(){const r=await j('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:activeSymbol()})});output.textContent=JSON.stringify(r,null,2);setBadge(r.data_source);refresh()}async function backtest(){const r=await j('/api/backtest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:activeSymbol()})});output.textContent=JSON.stringify(r,null,2);setBadge(r.data_source);refresh()}async function resetAgent(){output.textContent=JSON.stringify(await j('/api/reset',{method:'POST'}),null,2);refresh()}refresh();setInterval(refresh,5000)</script></body></html>
